aid: keepe
name: Keepe
description: >-
  Keepe operates a US nationwide service-provider network of vetted technicians
  covering HVAC, plumbing, electrical, furnace and heating, air conditioning,
  home appliances, and EV charger installation and repair. The platform
  streamlines the full home-services workflow end to end - recruiting, sourcing,
  dispatching, authorizing, and paying qualified technicians - so property
  managers, warranty companies, and insurers can get high-quality repair work
  completed reliably across markets. Keepe runs a consumer/technician mobile app
  and a private application backend at api.keepe.com; it does not publish a
  public developer API, developer portal, or API documentation. This profile was
  surfaced as a Techstars portfolio company and enriched by the API Evangelist
  pipeline with the infrastructure signals that are publicly observable.
